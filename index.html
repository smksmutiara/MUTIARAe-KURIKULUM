        window.viewGalleryAlbum = function(id) {
            const galleryData = JSON.parse(localStorage.getItem('mutiara_gallery_data')) || [];
            const item = galleryData.find(i => i.id == id);
            if (!item) return;
            let currentIndex = 0;
            const images = item.images;

            function renderSlide(index) {
                const imgContainer = document.getElementById('gallery-modal-img');
                const counter = document.getElementById('gallery-modal-counter');
                if(!imgContainer || !counter) return;
                
                const imgData = images[index];
                imgContainer.innerHTML = `<img src="${imgData.dataUrl}" alt="${imgData.name}" style="width:100%; height:100%; object-fit:contain; display:block;">`;
                counter.textContent = `${index + 1} / ${images.length}`;
                
                const prevBtn = document.querySelector('.gallery-btn-prev');
                const nextBtn = document.querySelector('.gallery-btn-next');
                if(prevBtn && nextBtn) {
                    prevBtn.style.display = images.length > 1 ? 'flex' : 'none';
                    nextBtn.style.display = images.length > 1 ? 'flex' : 'none';
                }
            }

            let albumHtml = `
                <div id="gallery-modal-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px; box-sizing:border-box; overflow:hidden;">
                    <button onclick="document.getElementById('gallery-modal-overlay').remove()" style="position:absolute; top:20px; right:20px; background:white; border:none; border-radius:50%; width:40px; height:40px; font-size:1.2rem; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.2); z-index:20;"><i class="fas fa-times"></i></button>
                    <h2 style="color:white; margin-bottom:20px; text-shadow:0 2px 10px rgba(0,0,0,0.5); text-align:center;">${item.caption}</h2>
                    
                    <div style="position:relative; width:100%; max-width:800px; height:60vh; background:#1a1a1a; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
                        <div id="gallery-modal-img" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; transition: opacity 0.3s ease;">
                        </div>
                        
                        <button class="gallery-btn-prev" onclick="window.slideGallery(-1)" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.2); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.1); border-radius:50%; width:40px; height:40px; color:white; font-size:1.2rem; cursor:pointer; transition:0.2s; display:none; align-items:center; justify-content:center; z-index:10;"><i class="fas fa-chevron-left"></i></button>
                        <button class="gallery-btn-next" onclick="window.slideGallery(1)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.2); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.1); border-radius:50%; width:40px; height:40px; color:white; font-size:1.2rem; cursor:pointer; transition:0.2s; display:none; align-items:center; justify-content:center; z-index:10;"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    
                    <div id="gallery-modal-counter" style="color:white; margin-top:15px; font-size:1rem; letter-spacing:1px; font-weight:500;"></div>
                </div>
            `;
            
            const overlay = document.createElement('div');
            overlay.innerHTML = albumHtml;
            document.body.appendChild(overlay);

            window.slideGallery = function(delta) {
                const newIndex = currentIndex + delta;
                if (newIndex >= 0 && newIndex < images.length) {
                    currentIndex = newIndex;
                    renderSlide(currentIndex);
                }
            };

            currentIndex = 0;
            renderSlide(0);
            
            const keyHandler = (e) => {
                if (e.key === 'ArrowLeft') window.slideGallery(-1);
                if (e.key === 'ArrowRight') window.slideGallery(1);
                if (e.key === 'Escape') document.getElementById('gallery-modal-overlay').remove();
            };
            
            const overlayElement = document.getElementById('gallery-modal-overlay');
            if(overlayElement) {
                overlayElement.addEventListener('keydown', keyHandler);
                overlayElement.setAttribute('tabindex', '0');
                overlayElement.focus();
            }
        };

            const modal = document.createElement('div');

            modal.innerHTML = `
                <div style="background:white; padding:40px; border-radius:24px; width:90%; max-width:500px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3); position:relative;">
                    <h3 style="color:var(--primary-blue); margin-bottom:10px;">Muat Naik Gambar</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:20px;">Anda boleh memilih berbilang gambar (atau satu folder).</p>
                    <input type="file" id="galleryFileInput" multiple webkitdirectory style="margin-bottom:15px; padding:10px; border:1px solid #ccc; border-radius:8px; width:100%;">
                    <input type="text" id="galleryCaptionInput" placeholder="Masukkan kapsyen / tajuk album" style="width:100%; padding:12px; border:2px solid rgba(201,168,76,0.3); border-radius:12px; font-size:1rem; margin-bottom:20px; outline:none; font-family:inherit;">
                    <button class="btn-login" onclick="processGalleryUpload()" style="width:100%; padding:14px; border:none; border-radius:12px; background:var(--gold); color:var(--primary-blue); font-weight:700; font-size:1rem; cursor:pointer; margin-top:10px;">Muat Naik Sekarang</button>
                    <i class="fas fa-times" style="position:absolute; top:15px; right:20px; font-size:1.5rem; color:var(--text-muted); cursor:pointer; transition:var(--transition);" onclick="this.closest('div[style*=\"fixed\"]').remove()"></i>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.processGalleryUpload = function() {
            const fileInput = document.getElementById('galleryFileInput');
            const captionInput = document.getElementById('galleryCaptionInput');
            const modal = fileInput.closest('div[style*="fixed"]');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Sila pilih sekurang-kurangnya satu gambar.');
                return;
            }
            if (!captionInput.value.trim()) {
                alert('Sila masukkan kapsyen / tajuk untuk album ini.');
                return;
            }

            const files = Array.from(fileInput.files);
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) {
                alert('Tiada fail gambar yang dijumpai dalam pilihan anda. Sila pilih fail gambar (.jpg, .png, dll).');
                return;
            }

            let loadedImages = 0;
            const processedImages = [];
            const caption = captionInput.value.trim();

            imageFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processedImages.push({
                        name: file.name,
                        dataUrl: e.target.result
                    });
                    loadedImages++;
                    if (loadedImages === imageFiles.length) {
                        let galleryData = JSON.parse(localStorage.getItem('mutiara_gallery_data')) || [];
                        const newAlbum = {
                            id: Date.now(),
                            caption: caption,
                            images: processedImages
                        };
                        galleryData.push(newAlbum);
                        try {
                            localStorage.setItem('mutiara_gallery_data', JSON.stringify(galleryData));
                            if (modal) modal.remove();
                            renderGallery();
                            alert(`Berjaya! ${processedImages.length} gambar telah dimuat naik ke dalam album "${caption}".`);
                        } catch (e) {
                            alert('Gagal menyimpan! Mungkin saiz gambar terlalu besar (melebihi 5MB). Sila muat naik gambar yang lebih kecil.');
                        }
                    }
                };
                reader.readAsDataURL(file);
            });
        };

        let currentMonth = 6, currentYear = 2026;
        let selectedDateStr = null;

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('.');
            if(parts.length === 3) {
                return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
            return null;
        }

        function isDateInRange(dateStr, rangeStr) {
            if (!rangeStr.includes('-')) return false;
            const rangeParts = rangeStr.split('-');
            if (rangeParts.length !== 2) return false;
            const startStr = rangeParts[0].trim();
            const endStr = rangeParts[1].trim();
            let startFull = startStr;
            if (startStr.split('.').length === 2) {
                const year = endStr.split('.')[2];
                startFull = startStr + '.' + year;
            }
            const startDate = parseDate(startFull);
            const endDate = parseDate(endStr);
            const targetDate = parseDate(dateStr);
            if (!startDate || !endDate || !targetDate) return false;
            return targetDate >= startDate && targetDate <= endDate;
        }

        function getEventsForDate(dateStr) {
            const results = [];
            takwimData.forEach(item => {
                const rawDate = item.date;
                if (rawDate === dateStr) results.push(item);
                else if (rawDate.includes('-')) {
                    if (isDateInRange(dateStr, rawDate)) results.push(item);
                }
            });
            return results;
        }

        function getEventsForMonth(month, year) {
            const results = [];
            const monthStr = (month + 1).toString().padStart(2, '0');
            takwimData.forEach(item => {
                const rawDate = item.date;
                if (rawDate.includes('.')) {
                    let checkMonth, checkYear;
                    if (rawDate.includes('-')) {
                        const endPart = rawDate.split('-')[1].trim();
                        const endParts = endPart.split('.');
                        if (endParts.length >= 2) {
                            checkMonth = endParts[1];
                            checkYear = endParts[2];
                        }
                    } else {
                        const parts = rawDate.split('.');
                        checkMonth = parts[1];
                        checkYear = parts[2];
                    }
                    if (checkMonth === monthStr && checkYear === String(year)) {
                        results.push(item);
                    }
                }
            });
            return results;
        }

        function updateEventList(events, headerText) {
            const container = document.getElementById('calendarEventsList');
            if (!container) return;
            let html = '';
            if (events.length === 0) {
                html = `<div class="no-events-msg">Tiada program pada tempoh ini.</div>`;
            } else {
                events.sort((a, b) => {
                    const aStr = a.date.includes('-') ? a.date.split('-')[1].trim() : a.date;
                    const bStr = b.date.includes('-') ? b.date.split('-')[1].trim() : b.date;
                    return aStr.localeCompare(bStr);
                });
                events.forEach(item => {
                    let displayDate = item.date;
                    let dayNum = '';
                    let monthStr = '';
                    if (item.date.includes('-')) {
                        const parts = item.date.split('-');
                        const startParts = parts[0].trim().split('.');
                        if(startParts.length >= 2) {
                            dayNum = startParts[0];
                            monthStr = startParts[1];
                        }
                    } else {
                        const parts = item.date.split('.');
                        if(parts.length >= 2) {
                            dayNum = parts[0];
                            monthStr = parts[1];
                        }
                    }
                    const monthNamesShort = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
                    let monthShort = monthStr ? monthNamesShort[parseInt(monthStr)-1] : '';
                    html += `
                        <div class="event-item">
                            <div class="event-date">
                                <div class="day">${dayNum}</div>
                                <div class="month">${monthShort}</div>
                            </div>
                            <div class="event-info">
                                <h5>${item.activity}</h5>
                                <p>Tarikh: ${displayDate} ${item.action && item.action !== '-' ? '· ' + item.action : ''}</p>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        function renderCalendar(month, year) {
            const grid = document.getElementById('calendarDays');
            if (!grid) return;
            const monthNames = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
            document.getElementById('monthLabel').textContent = monthNames[month] + ' ' + year;
            selectedDateStr = null;

            const firstDay = new Date(year, month, 1).getDay(); 
            const daysInMonth = new Date(year, month + 1, 0).getDate(); 
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const monthEvents = getEventsForMonth(month, year);
            const eventDatesSet = new Set();
            monthEvents.forEach(item => {
                if(item.date.includes('-')) {
                    const parts = item.date.split('-');
                    const start = parts[0].trim();
                    const end = parts[1].trim();
                    let startFull = start;
                    if(start.split('.').length === 2) {
                        const yearStr = end.split('.')[2];
                        startFull = start + '.' + yearStr;
                    }
                    eventDatesSet.add(startFull);
                    eventDatesSet.add(end);
                } else {
                    eventDatesSet.add(item.date);
                }
            });

            let html = ''; 
            const dayNames = ['Aha', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab']; 
            dayNames.forEach(d => { html += `<div class="day-name">${d}</div>`; });

            const startOffset = firstDay; 

            for (let i = startOffset - 1; i >= 0; i--) { 
                html += `<div class="day other-month">${daysInPrevMonth - i}</div>`; 
            }

            const today = new Date(); 
            const isCurrentMonth = (month === today.getMonth() && year === today.getFullYear()); 
            const todayDate = today.getDate();

            for (let d = 1; d <= daysInMonth; d++) { 
                let cls = 'day'; 
                let dateStr = `${d.toString().padStart(2, '0')}.${(month+1).toString().padStart(2, '0')}.${year}`;
                if (isCurrentMonth && d === todayDate) cls += ' today'; 
                if (eventDatesSet.has(dateStr)) cls += ' event'; 
                html += `<div class="${cls}" data-date="${dateStr}">${d}</div>`; 
            }

            const totalCells = startOffset + daysInMonth; 
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let d = 1; d <= remaining; d++) { 
                html += `<div class="day other-month">${d}</div>`; 
            }
            grid.innerHTML = html;

            displayEventsForMonth(month, year);

            grid.querySelectorAll('.day:not(.other-month)').forEach(dayEl => {
                dayEl.addEventListener('click', function(e) {
                    const dateStr = this.dataset.date;
                    if (!dateStr) return;
                    grid.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    displayEventsForDate(dateStr);
                });
            });
        }

        function displayEventsForDate(dateStr) {
            const events = getEventsForDate(dateStr);
            updateEventList(events, `Program pada ${dateStr}`);
        }

        function displayEventsForMonth(month, year) {
            const events = getEventsForMonth(month, year);
            const monthNames = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
            updateEventList(events, `Program Bulan ${monthNames[month]} ${year}`);
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentMonth, currentYear);
        }
        renderCalendar(currentMonth, currentYear);

        function loadEdits() {
            const rawData = localStorage.getItem('mutiara_curriculum_data');
            if (!rawData) return;
            try {
                const savedData = JSON.parse(rawData);
                for (const [id, htmlContent] of Object.entries(savedData)) {
                    const targetEl = document.getElementById(id);
                    if (targetEl) targetEl.innerHTML = htmlContent;
                }
            } catch (e) { console.error("Error loading saved edits:", e); }
        }

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.content-card, .announce-card, .event-item, .qa-card').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'all 0.6s ease';
                observer.observe(el);
            });
            setTimeout(() => {
                document.querySelectorAll('.content-card, .announce-card, .event-item, .qa-card').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight) {
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                    }
                });
            }, 300);
        }
